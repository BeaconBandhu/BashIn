<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div class="pill" id="pill">
      <span class="pill-time" id="pillTime">--:--</span>
    </div>
    <div class="panel" id="panel">
      <div class="header" id="header">
        <div class="date" id="date">—</div>
        <div class="time" id="time">--:--</div>
      </div>

      <div class="section-label">NOW PLAYING</div>
      <div class="now-playing">
        <span class="dot" id="playDot"></span>
        <div>
          <div class="np-title" id="npTitle">Nothing playing</div>
          <div class="np-artist" id="npArtist"></div>
        </div>
      </div>

      <div class="divider"></div>
      <div class="section-label">BASHIN</div>
      <div class="status-row"><span class="dot" id="statusDot"></span><span id="statusText">Idle</span></div>
      <div class="task-text" id="taskText">Idle</div>
      <div class="task-age" id="taskAge"></div>

      <div class="divider"></div>
      <div class="section-label">DEVICES</div>
      <div class="devices-list" id="devicesList"></div>

      <div class="divider"></div>
      <div class="actions">
        <button class="action-btn" id="btnDashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          <span>Dashboard</span>
        </button>
        <button class="action-btn" id="btnPair">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
          <span>Pair New</span>
        </button>
        <button class="action-btn" id="btnEnterCode">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h6"/></svg>
          <span>Enter Code</span>
        </button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
